<!-- css for the legend -->
<style>

a, span, div
{
  font-family: sourcesans;
  font-size: 16px;
}
  .legend {
    background-color: #fff;
    border-radius: 3px;
    bottom: 30px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
    padding: 10px;
    position: absolute;
    left: 10px;
    right: auto;
    z-index: 1;
    font-family: sourcesans;
    font-size: 16px;
}

.legend h4 {
    margin: 0 0 10px;
    font-family: sourcesans;
    font-size: 18px;
}

.legend div span {
    border-radius: 50%;
    display: inline-block;
    height: 10px;
    margin-right: 10px;
    width: 10px;
}

select
{
    font-family: sourcesans;
    font-size: 12pt;
    color: #000000;
    padding: 2px;
    appearance: none;
    background-color: #ebebeb;
    border: 1px solid #ebebeb;
}

option
{
    font-family: sourcesans;
    font-size: 12pt;
    color: #000000;
}
</style>
<title>localtransit.app</title>
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
<script src="shared.js"></script>
<script src="map.js?v=2b" defer></script>
<body onload=init()>

<div id="map" style="height: 100%; width: 100%;"></div>
<div id="state-legend" class="legend">
<span>Day of Week: 
    <select id="dayDrop">
        <option value="0" selected>Monday</option>
        <option value="1">Tuesday</option>
        <option value="2">Wednesday</option>
        <option value="3">Thursday</option>
        <option value="4">Friday</option>
        <option value="5">Saturday</option>
        <option value="6">Sunday</option>
    </select></span>
    <h4>Daytime Frequency</h4>
    <div><span style="background-color: #ae00c3"></span>Constant (&lt; 7.5 min.)</div>
    <div><span style="background-color: #00fff7"></span>Frequent (7.5 - 15 min.)</div>
    <div><span style="background-color: #56ff34"></span>Usable (15 - 30 min.)</div>
    <div><span style="background-color: #fcff00"></span>Infrequent (30 - 60 min.)</div>
    <div><span style="background-color: #ff0725"></span>Sparse (60 - 120 min.)</div>
    <div><span style="background-color: #8d6726"></span>Rare (&gt; 120 min.)</div>
    <div><span style="background-color: #cfcfcf"></span>No Daytime Trips</div>
</div>
